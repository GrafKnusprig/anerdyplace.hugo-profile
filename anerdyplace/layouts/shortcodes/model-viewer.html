<model-viewer
    src="{{ .Get `src` }}"
    alt="{{ .Get `alt` | default `3D model` }}"
    shadow-intensity="{{ .Get `shadow-intensity` | default `1.5` }}"
    shadow-softness="{{ .Get `shadow-softness` | default `0.5` }}"
    exposure="{{ .Get `exposure` | default `.75` }}"
    auto-rotate
    camera-controls
    style="width: 100%; height: 400px;">
</model-viewer>
